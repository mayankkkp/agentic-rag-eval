services:
    - type: web
      name: agentic-rag-dashboard
      runtime: python
      plan: free
      buildCommand: pip install -r requirements.txt
      startCommand: streamlit run eval/dashboard.py --server.port $PORT --server.address 0.0.0.0
      envVars:
        - key: PYTHON_VERSION
          value: "3.11.0"