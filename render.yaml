services:
  - type: web
    name: agentic-rag-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: /tmp/chroma_data
      - key: MAX_RETRIEVAL_ITERATIONS
        value: "2"
      - key: ANONYMIZED_TELEMETRY
        value: "false"
      - key: BASELINE_MODE
        value: "false"

  - type: web
    name: agentic-rag-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run eval/dashboard.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: GEMINI_API_KEY
        sync: false